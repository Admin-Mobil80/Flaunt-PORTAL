name: Deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC: id-token lets the job request a GitHub-signed token that
# AWS trades for temporary credentials. No access keys are stored anywhere.
permissions:
  id-token: write
  contents: read

# One deploy at a time. Two overlapping runs would race the sync and could
# leave the bucket holding a mix of two commits.
concurrency:
  group: deploy-portal
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::231427841372:role/flaunt-github-deploy-prod
  BUCKET: flaunt-portal-frontend-prod-231427841372
  DISTRIBUTION_ID: E1FCZNW80XQIU6

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Long cache on fingerprinted assets, none on HTML. index.html is the
      # entry point for a hash-routed single page: if a browser caches it, the
      # user keeps running the previous release even after an invalidation.
      - name: Sync assets
        run: |
          aws s3 sync public/ "s3://$BUCKET/" \
            --delete \
            --exclude "*.html" --exclude "version.json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML
        run: |
          aws s3 sync public/ "s3://$BUCKET/" \
            --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # version.json is how an open tab learns a new build shipped, so it must
      # never be cached — an immutable copy would pin the tab to this release.
      - name: Sync version manifest
        run: |
          aws s3 cp public/version.json "s3://$BUCKET/version.json" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$ID"

      - name: Verify
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://flaunt.network)
          echo "https://flaunt.network -> $CODE"
          test "$CODE" = "200"
